          border-radius: 8px;
          position: relative;
          background-color: black;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
          /* background-color: red; */
        }
        .luban-ruler::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 40%;
          background: linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.3),
            rgba(255, 255, 255, 0)
          );
          border-top-left-radius: 8px;
          border-top-right-radius: 8px;
        }
        .ruler-marker {
          position: absolute;
          width: 4px;
          background-color: #ff0000;
          height: 100%;
          top: 0;
          transform: translateX(-50%);
          z-index: 10;
        }
        .ruler-marker::after {
          content: "";
          position: absolute;
          bottom: -10px;
          left: 50%;
          transform: translateX(-50%);
          width: 0;
          height: 0;
          border-left: 10px solid transparent;
          border-right: 10px solid transparent;
          border-top: 10px solid #ff0000;
        }
        .ruler-section {
          position: absolute;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          color: white;
          font-weight: bold;
          text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
          box-sizing: border-box;
          padding: 0 4px;
          text-align: center;
        }
        .section-ji {
          background: linear-gradient(to bottom, #ff6347, #dc143c);
        }
        .section-xiong {
          background: linear-gradient(to bottom, #1e90ff, #0000cd);
        }
        .section-ji::before {
          content: "吉";
          position: absolute;
          top: 2px;
          right: 2px;
          font-size: 8px;
          opacity: 0.7;
        }
        .section-xiong::before {
          content: "凶";
          position: absolute;
          top: 2px;
          right: 2px;
          font-size: 8px;
          opacity: 0.7;
        }
        .detail-item {
          transition: all 0.3s ease;
        }
        .detail-item:hover {
          transform: translateY(-2px);
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .history-item {
          transition: all 0.2s ease;
        }
        .history-item:hover {
          background-color: rgba(255, 255, 255, 0.1);
        }
        .history-item.active {
          background-color: rgba(255, 215, 0, 0.2);
          border-left: 3px solid #ffd700;
        }
        .animate-pulse-slow {
          animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
          0%,
          100% {
            opacity: 1;
          }
          50% {
            opacity: 0.7;
          }
        }
        .animate-fade-in {
          animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
          from {
            opacity: 0;
            transform: translateY(10px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
        .animate-scale-in {
          animation: scaleIn 0.3s ease-in-out;
        }
        @keyframes scaleIn {
          from {
            transform: scale(0.95);
            opacity: 0;
          }
          to {
            transform: scale(1);
            opacity: 1;
          }
        }

              subName: "病临",
              explanation: "疾病缠身，身体虚弱",
            },
            {
              startCm: 35.0,
              endCm: 37.44,
              subName: "口舌",
              explanation: "口舌是非，争吵不断",
            },
            {
              startCm: 37.44,
              endCm: 38.88,
              subName: "官非",
              explanation: "官司缠身，是非不断",
            },
            {
              startCm: 38.88,
              endCm: 40.32,
              subName: "死临",
              explanation: "死亡降临，大凶之兆",
            },
          ],
        },
        {
          startCm: 40.32,
          endCm: 46.08,
          name: "本",
          type: "吉",
          details: [
            {
              startCm: 40.32,
              endCm: 41.76,
              subName: "财至",
              explanation: "财运亨通，财富积累",
            },
            {
              startCm: 41.76,
              endCm: 43.2,
              subName: "登科",
              explanation: "金榜题名，学业有成",
            },
            {
              startCm: 43.2,
              endCm: 44.64,
              subName: "进宝",
              explanation: "招财进宝，财源广进",
            },
            {
              startCm: 44.64,
              endCm: 46.08,
              subName: "兴旺",
              explanation: "事业兴旺，家庭幸福",
            },
          ],
        },
      ];

      // 历史记录数据
      let historyRecords =
        JSON.parse(localStorage.getItem("lubanRulerHistory")) || [];

      // DOM 元素
      const rulerSlider = document.getElementById("ruler-slider");
      const currentValueDisplay = document.getElementById("current-value");
      const rulerMarker = document.getElementById("ruler-marker");
      const lubanRuler = document.getElementById("luban-ruler");
      const cmBtn = document.getElementById("cm-btn");
      const inchBtn = document.getElementById("inch-btn");
      const lengthInput = document.getElementById("length-input");
      const queryBtn = document.getElementById("query-btn");
      const resultCharacter = document.getElementById("result-character");
      const resultType = document.getElementById("result-type");
      const resultDetails = document.getElementById("result-details");
      const historyTableBody = document.getElementById("history-table-body");
      const clearHistoryBtn = document.getElementById("clear-history-btn");
      const toast = document.getElementById("toast");

      // 当前单位（厘米/英寸）
      let currentUnit = "cm";

      // 初始化鲁班尺
      function initRuler() {
        // 清空尺子
        while (lubanRuler.firstChild) {
          if (lubanRuler.firstChild.id !== "ruler-marker") {
            lubanRuler.removeChild(lubanRuler.firstChild);
          } else {
            break;
          }
        }

        // 添加刻度和文字       这个不要
        // lubanRulerData.forEach((section) => {
        //   const sectionElement = document.createElement("div");
        //   sectionElement.className = `ruler-section section-${section.type}`;
        //   sectionElement.style.left = `${(section.startCm / 200) * 100}%`;
        //   sectionElement.style.width = `${
        //     ((section.endCm - section.startCm) / 200) * 100
        //   }%`;
        //   sectionElement.textContent = section.name;

        //   lubanRuler.appendChild(sectionElement);
        // });

        // 更新历史记录
        updateHistoryTable();
      }

      // 更新尺子显示
      function updateRuler(lengthCm) {
        // 计算位置百分比
        const positionPercent = (lengthCm / 200) * 100;

        // 更新滑块位置
        rulerSlider.value = lengthCm;

        // 更新标记位置
        rulerMarker.style.left = `${positionPercent}%`;

        // 更新当前值显示
        if (currentUnit === "cm") {
          currentValueDisplay.textContent = `${lengthCm.toFixed(1)} cm`;
        } else {
          const lengthInch = lengthCm / 2.54;
          currentValueDisplay.textContent = `${lengthInch.toFixed(2)} inch`;
        }

        // 更新输入框
        lengthInput.value =
          currentUnit === "cm"
            ? lengthCm.toFixed(1)
            : (lengthCm / 2.54).toFixed(2);

        // 更新结果
        updateResult(lengthCm);
      }

      // 更新结果
      function updateResult(lengthCm) {
        // 循环处理鲁班尺（考虑到尺子可以无限延伸）
        const baseLength = 46.08; // 鲁班尺基本长度
        const normalizedLength = lengthCm % baseLength;

        // 查找对应的刻度
        let foundSection = null;
        let foundDetail = null;

        for (const section of lubanRulerData) {
          if (
            normalizedLength >= section.startCm &&
            normalizedLength < section.endCm
          ) {
            foundSection = section;

            // 查找子项
            for (const detail of section.details) {
              if (
                normalizedLength >= detail.startCm &&
                normalizedLength < detail.endCm
              ) {
                foundDetail = detail;
                break;
              }
            }

            break;
          }
        }

        // 更新结果显示
        if (foundSection && foundDetail) {
          resultCharacter.textContent = foundSection.name;
          resultCharacter.className = `text-4xl font-bold mb-2 text-${foundSection.type}`;

          resultType.textContent = `${foundSection.type} - ${foundDetail.subName}`;
          resultType.className = `text-lg text-${foundSection.type}`;

          resultDetails.innerHTML = `
          <div class="text-center mb-4">
            <div class="text-xl font-bold ${
              foundSection.type === "吉" ? "text-ji" : "text-xiong"
            }">${foundDetail.subName}</div>
          </div>
          <p class="text-gray-300 mb-4">${foundDetail.explanation}</p>
          <div class="mt-6">
            <h4 class="font-bold text-accent mb-2">适用建议</h4>
            <ul class="text-sm text-gray-300 list-disc list-inside">
              ${getSuggestions(foundSection.name)}
            </ul>
          </div>
        `;

          // 添加到历史记录
          addToHistory(lengthCm, foundSection, foundDetail);
        } else {
          resultCharacter.textContent = "未知";
          resultCharacter.className = "text-4xl font-bold mb-2 text-gray-500";

          resultType.textContent = "请测量有效长度";
          resultType.className = "text-lg text-gray-500";

          resultDetails.innerHTML = `
          <p class="text-gray-400 text-center py-8">
            无法解析该长度的吉凶
          </p>
        `;
        }
      }

      // 获取适用建议
      function getSuggestions(sectionName) {
        const suggestions = {
          财: [
            "适合用于大门、保险柜、收银台",
            "有利于提升财运和财富积累",
            "商业场所最佳选择",
          ],
          病: [
            "应避免用于任何重要位置",
            "如已使用，建议进行风水化解",
            "可考虑放置葫芦等风水物品",
          ],
          离: [
            "不宜用于夫妻卧室或家庭主要活动区域",
            "可能导致家庭不睦或分离",
            "建议进行风水调整",
          ],
          义: [
            "适合用于书房、佛堂等精神修养空间",
            "有利于提升学业和道德修养",
            "祠堂、学校等公共场所最佳选择",
          ],
          官: [
            "适合用于办公室、书房",
            "有利于提升事业运势和官运",
            "政府机关或职场人士最佳选择",
          ],
          劫: [
            "应避免用于任何重要位置",
            "可能招致灾祸和破财",
            "建议进行专业风水化解",
          ],
          害: [
            "绝对不宜用于门窗尺寸",
            "可能招致疾病和口舌是非",
            "强烈建议调整尺寸",
          ],
          本: [
            "适合用于建筑的主要结构尺寸",
            "有利于家庭稳定和事业根基",
            "住宅大门的理想选择",
          ],
        };

        return suggestions[sectionName]
          ? suggestions[sectionName].map((s) => `<li>${s}</li>`).join("")
          : "<li>暂无特别建议</li>";
      }

      // 添加到历史记录
      function addToHistory(lengthCm, section, detail) {
        // 避免重复记录
        const existingIndex = historyRecords.findIndex(
          (record) => Math.abs(record.lengthCm - lengthCm) < 0.1
        );

        if (existingIndex !== -1) {
          // 更新现有记录
          historyRecords[existingIndex].timestamp = Date.now();
        } else {
          // 添加新记录
          historyRecords.unshift({
            id: Date.now(),
            lengthCm,
            section: section.name,
            type: section.type,
            subName: detail.subName,
            explanation: detail.explanation,
            timestamp: Date.now(),
          });

          // 限制历史记录数量
          if (historyRecords.length > 10) {
            historyRecords.pop();
          }
        }

        // 保存到本地存储
        localStorage.setItem(
          "lubanRulerHistory",
          JSON.stringify(historyRecords)
        );

        // 更新历史记录表格
        updateHistoryTable();
      }

      // 更新历史记录表格
      function updateHistoryTable() {
        if (historyRecords.length === 0) {
          historyTableBody.innerHTML = `
          <tr class="border-b border-gray-700">
            <td colspan="6" class="px-6 py-4 text-center text-gray-500">暂无查询记录</td>
          </tr>
        `;
          return;
        }

        historyTableBody.innerHTML = "";

        historyRecords.forEach((record, index) => {
          const tr = document.createElement("tr");
          tr.className = "border-b border-gray-700 history-item";
          tr.dataset.id = record.id;

          const lengthDisplay =
            currentUnit === "cm"
              ? `${record.lengthCm.toFixed(1)} cm`
              : `${(record.lengthCm / 2.54).toFixed(2)} inch`;

          tr.innerHTML = `
          <td class="px-6 py-4">${index + 1}</td>
          <td class="px-6 py-4">${lengthDisplay}</td>
          <td class="px-6 py-4">
            <span class="px-2 py-1 text-xs font-medium rounded-full ${
              record.type === "吉"
                ? "bg-ji bg-opacity-20 text-ji"
                : "bg-xiong bg-opacity-20 text-xiong"
            }">
              ${record.type}
            </span>
          </td>
          <td class="px-6 py-4">${record.section} - ${record.subName}</td>
          <td class="px-6 py-4 text-sm">${record.explanation}</td>
          <td class="px-6 py-4">
            <button class="text-accent hover:text-accent-light mr-3 use-again-btn" data-length="${
              record.lengthCm
            }">
              <i class="fa fa-refresh"></i>
            </button>
            <button class="text-gray-400 hover:text-gray-300 delete-record-btn" data-id="${
              record.id
            }">
              <i class="fa fa-trash"></i>
            </button>
          </td>
        `;

          historyTableBody.appendChild(tr);
        });

        // 添加事件监听器
        document.querySelectorAll(".use-again-btn").forEach((btn) => {
          btn.addEventListener("click", function () {
            const lengthCm = parseFloat(this.dataset.length);
            updateRuler(lengthCm);

            // 显示提示
            showToast("已加载历史记录");
          });
        });

        document.querySelectorAll(".delete-record-btn").forEach((btn) => {
          btn.addEventListener("click", function () {
            const id = parseInt(this.dataset.id);

            // 删除记录
            historyRecords = historyRecords.filter(
              (record) => record.id !== id
            );

            // 保存到本地存储
            localStorage.setItem(
              "lubanRulerHistory",
              JSON.stringify(historyRecords)
            );

            // 更新表格
            updateHistoryTable();

            // 显示提示
            showToast("已删除记录");
          });
        });
      }

      // 显示提示
      function showToast(message) {
        toast.textContent = message;
        toast.classList.remove("translate-y-full", "opacity-0");

        setTimeout(() => {
          toast.classList.add("translate-y-full", "opacity-0");
        }, 2000);
      }

      // 事件监听器
      rulerSlider.addEventListener("input", function () {
        const lengthCm = parseFloat(this.value);
        updateRuler(lengthCm);
      });

      cmBtn.addEventListener("click", function () {
        currentUnit = "cm";
        cmBtn.classList.add("bg-primary");
        cmBtn.classList.remove("bg-secondary-light");
        inchBtn.classList.add("bg-secondary-light");
        inchBtn.classList.remove("bg-primary");

        // 更新显示
        const currentLengthCm = parseFloat(rulerSlider.value);
        updateRuler(currentLengthCm);
      });

      inchBtn.addEventListener("click", function () {
        currentUnit = "inch";
        inchBtn.classList.add("bg-primary");
        inchBtn.classList.remove("bg-secondary-light");
        cmBtn.classList.add("bg-secondary-light");
        cmBtn.classList.remove("bg-primary");

        // 更新显示
        const currentLengthCm = parseFloat(rulerSlider.value);
        updateRuler(currentLengthCm);
      });

      queryBtn.addEventListener("click", function () {
        const inputValue = parseFloat(lengthInput.value);

        if (isNaN(inputValue) || inputValue < 0 || inputValue > 200) {
          showToast("请输入有效的长度（0-200）");
          return;
        }

        let lengthCm;

        if (currentUnit === "cm") {
          lengthCm = inputValue;
        } else {
          // 转换为厘米
          lengthCm = inputValue * 2.54;

          // 限制在0-200厘米范围内
          if (lengthCm > 200) {
            lengthCm = 200;
            lengthInput.value = (lengthCm / 2.54).toFixed(2);
          }
        }

        updateRuler(lengthCm);
      });

      lengthInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          queryBtn.click();
        }
      });

      clearHistoryBtn.addEventListener("click", function () {
        if (confirm("确定要清空所有历史记录吗？")) {
          historyRecords = [];
          localStorage.removeItem("lubanRulerHistory");
          updateHistoryTable();
          showToast("已清空历史记录");
        }
      });

      // 初始化
      document.addEventListener("DOMContentLoaded", function () {
        initRuler();
        updateRuler(0);
      });
    </script>
  </body>
</html>
